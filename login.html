<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>신원 확인</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+KR:wght@300;400&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #080808;
      color: #c8ffc8;
      font-family: 'Share Tech Mono', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(0, 255, 100, 0.015) 2px,
        rgba(0, 255, 100, 0.015) 4px
      );
      pointer-events: none;
      z-index: 10;
    }

    .container {
      width: 100%;
      max-width: 440px;
      padding: 20px;
      position: relative;
      z-index: 1;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .header .label {
      font-size: 10px;
      letter-spacing: 5px;
      color: #556655;
      margin-bottom: 12px;
    }

    .header h2 {
      font-size: 22px;
      letter-spacing: 8px;
      color: #e8ffe8;
      text-shadow: 0 0 15px rgba(0,255,100,0.4);
    }

    .panel {
      border: 1px solid #1a3a1a;
      padding: 36px 32px;
      background: rgba(0, 20, 0, 0.4);
      position: relative;
    }

    /* 모서리 장식 */
    .panel::before, .panel::after {
      content: '';
      position: absolute;
      width: 12px; height: 12px;
      border-color: #00ff66;
      border-style: solid;
    }
    .panel::before {
      top: -1px; left: -1px;
      border-width: 2px 0 0 2px;
    }
    .panel::after {
      bottom: -1px; right: -1px;
      border-width: 0 2px 2px 0;
    }

    .field {
      margin-bottom: 24px;
    }

    .field label {
      display: block;
      font-size: 10px;
      letter-spacing: 4px;
      color: #557755;
      margin-bottom: 8px;
    }

    .field input {
      width: 100%;
      background: #050f05;
      border: 1px solid #1a3a1a;
      border-bottom-color: #00ff6633;
      color: #c8ffc8;
      font-family: 'Share Tech Mono', monospace;
      font-size: 16px;
      padding: 12px 14px;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
      letter-spacing: 2px;
    }

    .field input:focus {
      border-color: #00ff6666;
      box-shadow: 0 0 10px rgba(0, 255, 100, 0.1);
    }

    .field input::placeholder {
      color: #2a4a2a;
      letter-spacing: 1px;
    }

    .hint {
      font-size: 10px;
      color: #3a5a3a;
      margin-top: 6px;
      letter-spacing: 1px;
      font-family: 'Noto Sans KR', sans-serif;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: transparent;
      border: 1px solid #00ff66;
      color: #00ff66;
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px;
      letter-spacing: 6px;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
      position: relative;
      overflow: hidden;
    }

    .login-btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: rgba(0, 255, 100, 0.08);
      transition: left 0.3s;
    }

    .login-btn:hover::before { left: 0; }
    .login-btn:hover { box-shadow: 0 0 16px rgba(0,255,100,0.25); }
    .login-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .error-msg {
      margin-top: 16px;
      padding: 10px 14px;
      background: rgba(255, 0, 0, 0.08);
      border-left: 2px solid #ff4444;
      color: #ff7777;
      font-size: 12px;
      letter-spacing: 1px;
      font-family: 'Noto Sans KR', sans-serif;
      display: none;
    }

    .loading-msg {
      margin-top: 16px;
      color: #557755;
      font-size: 11px;
      letter-spacing: 3px;
      text-align: center;
      display: none;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 24px;
      font-size: 11px;
      color: #334433;
      text-decoration: none;
      letter-spacing: 3px;
      transition: color 0.3s;
    }
    .back-link:hover { color: #557755; }

    /* 로그인 성공 오버레이 */
    .success-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #080808;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s;
    }

    .success-overlay.show {
      opacity: 1;
      pointer-events: all;
    }

    .success-text {
      font-size: 18px;
      letter-spacing: 6px;
      color: #00ff66;
      text-shadow: 0 0 20px rgba(0,255,100,0.8);
      text-align: center;
    }

    .success-text .agent-name {
      display: block;
      font-size: 13px;
      letter-spacing: 4px;
      color: #99cc99;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB2oyLYjYek0b2osLMy-0bYhcBBlNQL914",
      authDomain: "agent-game-516d4.firebaseapp.com",
      projectId: "agent-game-516d4",
      storageBucket: "agent-game-516d4.firebasestorage.app",
      messagingSenderId: "751449864751",
      appId: "1:751449864751:web:d2cbdea0bb3dcf929864da"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // ──────────────────────────────────────────
    // 플레이어 아이디 → 이메일 매핑 테이블
    // 나중에 실제 요원 코드네임으로 바꿔!
    // 예: "AGENT-01" → "agent01@op.game"
    // ──────────────────────────────────────────
    const AGENT_MAP = {
      "agent1": "agent1@op.game",
      "agent2": "agent2@op.game",
      "agent3": "agent3@op.game",
      "agent4": "agent4@op.game",
      "agent5": "agent5@op.game",
    };

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const agentId = document.getElementById('agentId').value.trim().toUpperCase();
      const password = document.getElementById('password').value.trim();
      const btn = document.getElementById('loginBtn');
      const errorEl = document.getElementById('errorMsg');
      const loadingEl = document.getElementById('loadingMsg');

      errorEl.style.display = 'none';
      btn.disabled = true;
      loadingEl.style.display = 'block';

      const email = AGENT_MAP[agentId];
      if (!email) {
        errorEl.textContent = '등록되지 않은 요원 코드입니다.';
        errorEl.style.display = 'block';
        btn.disabled = false;
        loadingEl.style.display = 'none';
        return;
      }

      try {
        const userCred = await signInWithEmailAndPassword(auth, email, password);
        loadingEl.style.display = 'none';

        // 로그인 성공 → 요원 이름 가져오기
        const overlay = document.getElementById('successOverlay');
        overlay.classList.add('show');
        document.getElementById('successAgentName').textContent = agentId;

        // 1.5초 후 stage1으로 이동
        setTimeout(() => {
          window.location.href = 'stage1.html';
        }, 1800);

      } catch (err) {
        loadingEl.style.display = 'none';
        btn.disabled = false;

        if (err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
          errorEl.textContent = '비밀번호가 올바르지 않습니다. 단서를 다시 확인하십시오.';
        } else if (err.code === 'auth/too-many-requests') {
          errorEl.textContent = '시도 횟수 초과. 잠시 후 다시 시도하십시오.';
        } else {
          errorEl.textContent = '오류가 발생했습니다: ' + err.code;
        }
        errorEl.style.display = 'block';
      }
    });
  </script>

  <div class="container">
    <div class="header">
      <div class="label">// IDENTITY VERIFICATION //</div>
      <h2>신원 확인</h2>
    </div>

    <div class="panel">
      <form id="loginForm">
        <div class="field">
          <label>AGENT CODE</label>
          <input
            type="text"
            id="agentId"
            placeholder="요원 코드를 입력하십시오"
            autocomplete="off"
            spellcheck="false"
          />
          <div class="hint">조직에서 부여받은 코드를 입력</div>
        </div>

        <div class="field">
          <label>ACCESS KEY</label>
          <input
            type="password"
            id="password"
            placeholder="접근 키를 입력하십시오"
            autocomplete="off"
          />
          <div class="hint">수집한 단서로 도출한 정답을 입력</div>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
          접근 시도
        </button>

        <div class="error-msg" id="errorMsg"></div>
        <div class="loading-msg" id="loadingMsg">신원 확인 중...</div>
      </form>
    </div>

    <a href="index.html" class="back-link">← 돌아가기</a>
  </div>

  <!-- 로그인 성공 오버레이 -->
  <div class="success-overlay" id="successOverlay">
    <div class="success-text">
      신원 확인 완료
      <span class="agent-name" id="successAgentName"></span>
    </div>
  </div>

</body>
</html>
